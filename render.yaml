services:
  - type: web
    name: dadajon-tort-api
    env: node
    rootDir: ./backend
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: BOT_USERNAME
        value: DadajonTortBot
      - key: SHOP_NAME
        value: Dadajon Tort
      # Quyidagilarni Render Dashboard > Environment bo'limida qo'lda kiriting —
      # maxfiy qiymatlar bo'lgani uchun bu faylda (va git'da) saqlanmaydi:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MAIN_OPERATOR_PHONE
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: ADMIN_TELEGRAM
        sync: false
